name: multi-stage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline-diagnosis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Export pipeline schemas
        run: |
          rac schema pipeline --output build/pipeline.schema.json
          rac schema pipeline-evidence --output build/pipeline-evidence.schema.json
      - name: Validate pipeline specification schema
        run: >-
          python -c "import json,yaml; from jsonschema import validate;
          validate(yaml.safe_load(open('examples/multi-stage/pipeline.yaml')),json.load(open('build/pipeline.schema.json')));
          print('pipeline spec schema valid')"
      - name: Run four-stage migration pipeline
        run: >-
          rac pipeline examples/multi-stage/pipeline.yaml
          --evidence build/pipeline.json
          --report build/pipeline.md
          --html build/pipeline.html
          --no-fail-on-diff
      - name: Validate pipeline evidence and first divergence
        run: >-
          python -c "import json; from jsonschema import validate;
          r=json.load(open('build/pipeline.json'));
          validate(r,json.load(open('build/pipeline-evidence.schema.json')));
          assert r['status']=='failed',r['status'];
          assert r['summary']['transitions_failed']==2,r['summary'];
          by={(x['check_id'],json.dumps(x['locator'],sort_keys=True)):x for x in r['first_divergence']};
          amount=by[('amount',json.dumps({'key':'1002'},sort_keys=True))];
          coverage=by[('coverage',json.dumps({'difference':'missing_in_target','key':'1002'},sort_keys=True))];
          assert amount['first_transition']=='extract-to-transformed',amount;
          assert coverage['first_transition']=='transformed-to-target',coverage;
          assert r['summary']['end_to_end_status']=='failed';
          print('first divergence valid')"
      - name: Run clean subset only
        run: >-
          rac pipeline examples/multi-stage/pipeline.yaml
          --from-stage source
          --to-stage extract
          --evidence build/subset.json
          --report build/subset.md
          --html build/subset.html
      - name: Verify subset is green and skips full end-to-end
        run: >-
          python -c "import json;
          r=json.load(open('build/subset.json'));
          assert r['status']=='passed',r['status'];
          assert r['summary']['transitions_total']==1,r['summary'];
          assert r['summary']['first_divergences']==0,r['summary'];
          assert not r['summary']['end_to_end_executed'];
          print('pipeline subset valid')"
