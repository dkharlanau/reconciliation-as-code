name: wire-diff-cli

on:
  push:
    branches: [agent/run-diff]
    paths:
      - .github/workflows/wire-diff-cli.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/run-diff
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch CLI and schema registry
        run: python scripts/wire_diff_cli.py
      - name: Commit final wiring and remove one-time helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire rac diff command and diff schema"
          git push origin HEAD:agent/run-diff
