name: wire-pipeline-cli

on:
  push:
    branches: [agent/multi-stage]
    paths:
      - .github/workflows/wire-pipeline-cli.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multi-stage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/wire_pipeline_cli.py
      - name: Commit final pipeline CLI wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire rac pipeline command and schemas"
          git push origin HEAD:agent/multi-stage
