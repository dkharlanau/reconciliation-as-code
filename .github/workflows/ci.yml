name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: rac validate examples/customer-migration/reconciliation.yaml
      - run: rac validate examples/scoped-controls/reconciliation.yaml
      - run: rac validate examples/customer-object/reconciliation.yaml
      - run: rac schema evidence --output build/evidence.schema.json
      - name: Smoke-test evidence generation
        run: rac run examples/customer-migration/reconciliation.yaml --evidence build/evidence.json --report build/evidence.md --no-fail-on-diff
      - name: Smoke-test scoped aggregate evidence bundle
        run: >-
          rac run examples/scoped-controls/reconciliation.yaml
          --evidence build/scoped-evidence.json
          --report build/scoped-evidence.md
          --bundle build/scoped-bundle
          --no-fail-on-diff
      - name: Smoke-test hierarchical customer evidence bundle
        run: >-
          rac run examples/customer-object/reconciliation.yaml
          --evidence build/customer-object-evidence.json
          --report build/customer-object-evidence.md
          --bundle build/customer-object-bundle
          --no-fail-on-diff
      - name: Validate generated evidence schema
        run: >-
          python -c "import json; from jsonschema import validate;
          schema=json.load(open('build/evidence.schema.json'));
          validate(json.load(open('build/evidence.json')), schema);
          validate(json.load(open('build/scoped-evidence.json')), schema);
          validate(json.load(open('build/scoped-bundle/evidence.json')), schema);
          validate(json.load(open('build/customer-object-evidence.json')), schema);
          validate(json.load(open('build/customer-object-bundle/evidence.json')), schema);
          print('evidence schemas valid')"
      - name: Verify evidence bundle shape
        run: >-
          python -c "from pathlib import Path;
          root=Path('build/scoped-bundle');
          required=['evidence.json','evidence.md','evidence.html','evidence.xlsx','manifest.json','details/missing.csv','details/unexpected.csv','details/field-mismatches.csv','details/aggregate-mismatches.csv','details/exceptions.csv'];
          missing=[name for name in required if not (root/name).exists()];
          assert not missing, missing; print('bundle shape valid')"
      - name: Verify hierarchical discrepancies reach hand-off CSVs
        run: >-
          python -c "from pathlib import Path;
          root=Path('build/customer-object-bundle/details');
          missing=(root/'missing.csv').read_text();
          unexpected=(root/'unexpected.csv').read_text();
          fields=(root/'field-mismatches.csv').read_text();
          assert 'missing_child_in_target' in missing;
          assert 'unexpected_child_in_target' in unexpected;
          assert 'changed_child_field' in fields;
          assert 'customer/C1/addresses/A2' in fields;
          print('hierarchical bundle categories valid')"
      - name: Smoke-test dataset inspection
        run: rac inspect examples/customer-migration/legacy.csv --json > build/legacy-profile.json
      - name: Smoke-test generated reconciliation spec
        run: >-
          rac init examples/customer-migration/legacy.csv examples/customer-migration/s4.csv
          --source-key CUSTOMER_ID --target-key LEGACY_ID
          --output build/generated-reconciliation.yaml
      - run: rac validate build/generated-reconciliation.yaml
