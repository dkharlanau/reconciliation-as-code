name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: rac validate examples/customer-migration/reconciliation.yaml
      - run: rac validate examples/scoped-controls/reconciliation.yaml
      - run: rac validate examples/accepted-exceptions/reconciliation.yaml
      - run: rac validate examples/customer-bp-hierarchy/reconciliation.yaml
      - run: rac validate examples/identity-merge-split/reconciliation.yaml
      - run: rac validate examples/materiality/reconciliation.yaml
      - run: rac validate examples/sql-sqlite/reconciliation.yaml
      - run: rac schema evidence --output build/evidence.schema.json
      - run: rac schema spec --output build/spec.schema.json
      - name: Smoke-test evidence generation
        run: rac run examples/customer-migration/reconciliation.yaml --evidence build/evidence.json --report build/evidence.md --no-fail-on-diff
      - name: Smoke-test DuckDB execution
        run: >-
          rac run examples/scoped-controls/reconciliation.yaml
          --engine duckdb
          --evidence build/duckdb-evidence.json
          --report build/duckdb-evidence.md
          --no-fail-on-diff
      - name: Prepare SQLite SQL example
        run: python examples/sql-sqlite/setup.py
      - name: Smoke-test SQL-to-SQL extraction with DuckDB
        env:
          RAC_CONNECTION_LEGACY_SQLITE: sqlite:///${{ github.workspace }}/examples/sql-sqlite/legacy.db
          RAC_CONNECTION_TARGET_SQLITE: sqlite:///${{ github.workspace }}/examples/sql-sqlite/target.db
        run: >-
          rac run examples/sql-sqlite/reconciliation.yaml
          --engine duckdb
          --evidence build/sql-evidence.json
          --report build/sql-evidence.md
      - name: Smoke-test scoped aggregate evidence bundle
        run: >-
          rac run examples/scoped-controls/reconciliation.yaml
          --evidence build/scoped-evidence.json
          --report build/scoped-evidence.md
          --bundle build/scoped-bundle
          --no-fail-on-diff
      - name: Smoke-test governed accepted exception
        run: >-
          rac run examples/accepted-exceptions/reconciliation.yaml
          --evidence build/accepted-evidence.json
          --report build/accepted-evidence.md
          --bundle build/accepted-bundle
      - name: Smoke-test hierarchical Customer/BP reconciliation
        run: >-
          rac run examples/customer-bp-hierarchy/reconciliation.yaml
          --evidence build/hierarchy-evidence.json
          --report build/hierarchy-evidence.md
          --bundle build/hierarchy-bundle
          --no-fail-on-diff
      - name: Smoke-test changed-ID merge/split reconciliation
        run: >-
          rac run examples/identity-merge-split/reconciliation.yaml
          --evidence build/identity-evidence.json
          --report build/identity-evidence.md
          --bundle build/identity-bundle
      - name: Smoke-test business materiality reconciliation
        run: >-
          rac run examples/materiality/reconciliation.yaml
          --evidence build/materiality-evidence.json
          --report build/materiality-evidence.md
          --bundle build/materiality-bundle
          --no-fail-on-diff
      - name: Validate published spec examples
        run: >-
          python -c "import json,yaml; from jsonschema import validate;
          schema=json.load(open('build/spec.schema.json'));
          names=['customer-bp-hierarchy','accepted-exceptions','identity-merge-split','materiality','sql-sqlite'];
          [validate(yaml.safe_load(open('examples/'+name+'/reconciliation.yaml')),schema) for name in names];
          print('spec schemas valid')"
      - name: Validate generated evidence schema
        run: >-
          python -c "import json; from jsonschema import validate;
          schema=json.load(open('build/evidence.schema.json'));
          names=['evidence.json','duckdb-evidence.json','sql-evidence.json','scoped-evidence.json','accepted-evidence.json','hierarchy-evidence.json','identity-evidence.json','materiality-evidence.json'];
          [validate(json.load(open('build/'+name)), schema) for name in names];
          print('evidence schemas valid')"
      - name: Verify SQL evidence has no connection URL
        run: >-
          python -c "import json;
          text=open('build/sql-evidence.json').read(); result=json.loads(text);
          assert 'sqlite:///' not in text;
          assert result['inputs']['source']['input_type']=='sql';
          assert result['inputs']['source']['dialect']=='sqlite';
          assert result['inputs']['source']['connection_ref']=='legacy-sqlite';
          assert len(result['inputs']['source']['query_sha256'])==64;
          assert result['run']['backend']=='duckdb';
          print('sql provenance safe')"
      - name: Verify accepted-exception outcome
        run: >-
          python -c "import json;
          result=json.load(open('build/accepted-evidence.json'));
          assert result['status']=='passed', result['status'];
          assert result['summary']['accepted_exceptions']==1, result['summary'];
          assert result['summary']['expired_exceptions']==0, result['summary'];
          print('accepted-exception governance valid')"
      - name: Verify hierarchy evidence
        run: >-
          python -c "import json;
          result=json.load(open('build/hierarchy-evidence.json'));
          assert result['summary']['child_collections']==2, result['summary'];
          assert result['summary']['objects_failed']>=1, result['summary'];
          paths=[d.get('object_path') for c in result['checks'] for d in c.get('details',[]) if d.get('object_path')];
          assert any(p.startswith('CustomerBP/100003/') for p in paths), paths;
          print('hierarchy evidence valid')"
      - name: Verify identity evidence
        run: >-
          python -c "import json;
          result=json.load(open('build/identity-evidence.json'));
          assert result['status']=='passed', result['status'];
          modes=sorted(c['mode'] for c in result['identity']['components']);
          assert modes==['1:1','1:N','N:1'], modes;
          assert result['summary']['identity_components']==3, result['summary'];
          print('identity merge/split evidence valid')"
      - name: Verify materiality evidence
        run: >-
          python -c "import json;
          result=json.load(open('build/materiality-evidence.json'));
          name=next(c for c in result['checks'] if c['id']=='customer-name');
          credit=next(c for c in result['checks'] if c['id']=='credit-limit');
          assert result['status']=='failed', result['status'];
          assert name['status']=='passed' and name['metrics']['mismatches']==1, name;
          assert credit['status']=='failed'; assert result['summary']['critical_failures']==1;
          print('materiality evidence valid')"
      - name: Verify DuckDB metadata
        run: >-
          python -c "import json;
          result=json.load(open('build/duckdb-evidence.json'));
          assert result['run']['backend']=='duckdb'; assert result['run']['duckdb_version'];
          print('duckdb execution metadata valid')"
      - name: Verify evidence bundle shape
        run: >-
          python -c "from pathlib import Path;
          root=Path('build/scoped-bundle');
          required=['evidence.json','evidence.md','evidence.html','evidence.xlsx','manifest.json','details/missing.csv','details/unexpected.csv','details/field-mismatches.csv','details/aggregate-mismatches.csv','details/exceptions.csv'];
          missing=[name for name in required if not (root/name).exists()];
          assert not missing, missing; print('bundle shape valid')"
      - name: Smoke-test dataset inspection
        run: rac inspect examples/customer-migration/legacy.csv --json > build/legacy-profile.json
      - name: Smoke-test generated reconciliation spec
        run: >-
          rac init examples/customer-migration/legacy.csv examples/customer-migration/s4.csv
          --source-key CUSTOMER_ID --target-key LEGACY_ID
          --output build/generated-reconciliation.yaml
      - run: rac validate build/generated-reconciliation.yaml

  sql-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAC_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[postgres,duckdb]'
      - name: Run live PostgreSQL adapter tests
        run: python -m unittest discover -s tests -p 'test_sql_postgres.py' -v

  duckdb-million-row:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[duckdb]'
      - name: Generate 1M-row migration extracts
        run: python benchmarks/generate_large_fixture.py --rows 1000000 --output build/benchmark-1m
      - name: Reconcile 1M rows with DuckDB
        run: >-
          rac run build/benchmark-1m/reconciliation.yaml
          --engine duckdb
          --evidence build/benchmark-1m/evidence.json
          --report build/benchmark-1m/evidence.md
      - name: Verify million-row evidence
        run: >-
          python -c "import json;
          result=json.load(open('build/benchmark-1m/evidence.json'));
          assert result['status']=='passed', result['status'];
          assert result['run']['backend']=='duckdb', result['run'];
          assert result['summary']['source_records']==1000000, result['summary'];
          assert result['summary']['target_records']==1000000, result['summary'];
          assert result['summary']['matched_records']==1000000, result['summary'];
          print('million-row benchmark duration_ms=',result['run']['duration_ms'])"
