name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: rac validate examples/customer-migration/reconciliation.yaml
      - run: rac validate examples/scoped-controls/reconciliation.yaml
      - run: rac validate examples/accepted-exceptions/reconciliation.yaml
      - run: rac validate examples/customer-bp-hierarchy/reconciliation.yaml
      - run: rac validate examples/identity-merge-split/reconciliation.yaml
      - run: rac schema evidence --output build/evidence.schema.json
      - run: rac schema spec --output build/spec.schema.json
      - name: Smoke-test evidence generation
        run: rac run examples/customer-migration/reconciliation.yaml --evidence build/evidence.json --report build/evidence.md --no-fail-on-diff
      - name: Smoke-test scoped aggregate evidence bundle
        run: >-
          rac run examples/scoped-controls/reconciliation.yaml
          --evidence build/scoped-evidence.json
          --report build/scoped-evidence.md
          --bundle build/scoped-bundle
          --no-fail-on-diff
      - name: Smoke-test governed accepted exception
        run: >-
          rac run examples/accepted-exceptions/reconciliation.yaml
          --evidence build/accepted-evidence.json
          --report build/accepted-evidence.md
          --bundle build/accepted-bundle
      - name: Smoke-test hierarchical Customer/BP reconciliation
        run: >-
          rac run examples/customer-bp-hierarchy/reconciliation.yaml
          --evidence build/hierarchy-evidence.json
          --report build/hierarchy-evidence.md
          --bundle build/hierarchy-bundle
          --no-fail-on-diff
      - name: Smoke-test changed-ID merge/split reconciliation
        run: >-
          rac run examples/identity-merge-split/reconciliation.yaml
          --evidence build/identity-evidence.json
          --report build/identity-evidence.md
          --bundle build/identity-bundle
      - name: Validate published spec examples
        run: >-
          python -c "import json,yaml; from jsonschema import validate;
          schema=json.load(open('build/spec.schema.json'));
          validate(yaml.safe_load(open('examples/customer-bp-hierarchy/reconciliation.yaml')), schema);
          validate(yaml.safe_load(open('examples/accepted-exceptions/reconciliation.yaml')), schema);
          validate(yaml.safe_load(open('examples/identity-merge-split/reconciliation.yaml')), schema);
          print('spec schemas valid')"
      - name: Validate generated evidence schema
        run: >-
          python -c "import json; from jsonschema import validate;
          schema=json.load(open('build/evidence.schema.json'));
          validate(json.load(open('build/evidence.json')), schema);
          validate(json.load(open('build/scoped-evidence.json')), schema);
          validate(json.load(open('build/scoped-bundle/evidence.json')), schema);
          validate(json.load(open('build/accepted-evidence.json')), schema);
          validate(json.load(open('build/accepted-bundle/evidence.json')), schema);
          validate(json.load(open('build/hierarchy-evidence.json')), schema);
          validate(json.load(open('build/hierarchy-bundle/evidence.json')), schema);
          validate(json.load(open('build/identity-evidence.json')), schema);
          validate(json.load(open('build/identity-bundle/evidence.json')), schema);
          print('evidence schemas valid')"
      - name: Verify accepted-exception outcome
        run: >-
          python -c "import json;
          result=json.load(open('build/accepted-evidence.json'));
          assert result['status']=='passed', result['status'];
          assert result['summary']['accepted_exceptions']==1, result['summary'];
          assert result['summary']['expired_exceptions']==0, result['summary'];
          print('accepted-exception governance valid')"
      - name: Verify hierarchy evidence
        run: >-
          python -c "import json;
          result=json.load(open('build/hierarchy-evidence.json'));
          assert result['summary']['child_collections']==2, result['summary'];
          assert result['summary']['objects_failed']>=1, result['summary'];
          assert 'addresses' in result['hierarchy']['collections'];
          assert 'sales_areas' in result['hierarchy']['collections'];
          paths=[d.get('object_path') for c in result['checks'] for d in c.get('details',[]) if d.get('object_path')];
          assert any(p.startswith('CustomerBP/100003/') for p in paths), paths;
          print('hierarchy evidence valid')"
      - name: Verify identity evidence
        run: >-
          python -c "import json;
          result=json.load(open('build/identity-evidence.json'));
          assert result['status']=='passed', result['status'];
          modes=sorted(c['mode'] for c in result['identity']['components']);
          assert modes==['1:1','1:N','N:1'], modes;
          assert result['summary']['source_raw_records']==4, result['summary'];
          assert result['summary']['target_raw_records']==4, result['summary'];
          assert result['summary']['identity_components']==3, result['summary'];
          assert 'identity_crosswalk' in result['inputs'];
          print('identity merge/split evidence valid')"
      - name: Verify evidence bundle shape
        run: >-
          python -c "from pathlib import Path;
          root=Path('build/scoped-bundle');
          required=['evidence.json','evidence.md','evidence.html','evidence.xlsx','manifest.json','details/missing.csv','details/unexpected.csv','details/field-mismatches.csv','details/aggregate-mismatches.csv','details/exceptions.csv'];
          missing=[name for name in required if not (root/name).exists()];
          assert not missing, missing; print('bundle shape valid')"
      - name: Smoke-test dataset inspection
        run: rac inspect examples/customer-migration/legacy.csv --json > build/legacy-profile.json
      - name: Smoke-test generated reconciliation spec
        run: >-
          rac init examples/customer-migration/legacy.csv examples/customer-migration/s4.csv
          --source-key CUSTOMER_ID --target-key LEGACY_ID
          --output build/generated-reconciliation.yaml
      - run: rac validate build/generated-reconciliation.yaml
